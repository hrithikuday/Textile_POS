{% extends "pos/base.html" %}
{% block title %}Edit supplier{% endblock %}
{% block heading %}Edit supplier{% endblock %}
{% block content %}
<div class="card shadow col-lg-7 px-0">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>
            {% endfor %}
            <button class="btn btn-primary" type="submit">Save changes</button>
            <a class="btn btn-light" href="{% url 'operations:suppliers' %}">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
