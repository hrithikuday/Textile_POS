{% extends "pos/base.html" %}

<!-- Page title  -->
{% block title %}Add product{% endblock title %}

<!-- Specific Page CSS goes HERE  -->
{% block stylesheets %}{% endblock stylesheets %}

<!-- Page Heading -->
{% block heading %}Add product{% endblock heading %}

<!-- Page content  -->
{% block content %}
<!--Go back-->
<div class="row ml-0 mb-3">
    <a href="{% url 'products:products_list' %}">
        <button type="button" class="btn btn-info font-weight-bold">
            <i class="fas fa-long-arrow-alt-left mr-2"></i>
            Go back
        </button>
    </a>
</div>

<div class="row">
    <div class="card col-md-8">
        <div class="card-body">
            <form action="{% url 'products:products_add' %}"  method="post">
                {% csrf_token %}
                <div class="form-row">
                    <div class="form-group col-md-8">
                        <label for="inputDescription">Name</label>
                        <input type="text" class="form-control" name="name" placeholder="Cotton kurta, denim fabric..." required>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="state">State</label>
                        <select name="state" class="form-control" required>
                            {% for status in product_status %}
                            <option value="{{status.0}}">{{status.1}}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-4">
                        <label for="sku">SKU / product code (optional)</label>
                        <input type="text" name="sku" class="form-control" placeholder="Generated automatically if blank">
                    </div>
                    <div class="form-group col-md-8">
                        <label for="inputDescription">Description</label>
                        <input type="text" name="description" class="form-control" placeholder="Fabric or garment details" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-3">
                        <label for="material">Material / fabric</label>
                        <input type="text" name="material" class="form-control" placeholder="Cotton, silk, linen">
                    </div>
                    <div class="form-group col-md-3">
                        <label for="color">Color</label>
                        <input type="text" name="color" class="form-control" placeholder="Indigo">
                    </div>
                    <div class="form-group col-md-3">
                        <label for="size">Size / pattern</label>
                        <input type="text" name="size" class="form-control" placeholder="M, 2m x 1.5m">
                    </div>
                    <div class="form-group col-md-3">
                        <label for="unit">Inventory unit</label>
                        <select name="unit" class="form-control" required>
                            {% for unit in product_units %}
                            <option value="{{ unit.0 }}">{{ unit.1 }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-4">
                        <label for="category">Category</label>
                        <select name="category" class="form-control" required>
                            <option value="" selected disabled hidden>Select the category</option>
                            {% for category in categories %}
                            <option value="{{category.id}}">{{category.name}}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-8">
                        <label for="inputPrice">Price</label>
                        <input type="number" name="price" min="0.01" step="0.01" class="form-control" placeholder="10.99" required>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="stock_quantity">Stock quantity (<span id="stock-unit-label">piece</span>)</label>
                        <input type="number" name="stock_quantity" min="0" step="0.01" value="0" class="form-control" required>
                    </div>
                </div>
                

                <button type="submit" class="btn btn-success font-weight-bold">Create product</button>
               
            </form>
        </div>
    </div>
</div>
{% endblock content %}

<!-- Specific Page JS goes HERE  -->
{% block javascripts %}
<script>
    document.querySelector('[name="unit"]').addEventListener('change', function () {
        document.getElementById('stock-unit-label').textContent = this.value;
    });
</script>
{% endblock javascripts %}
