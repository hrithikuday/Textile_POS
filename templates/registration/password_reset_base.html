{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Password reset | Textile POS{% endblock %}</title>
    <link href="{% static 'vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/sb-admin-2.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/pos-app.css' %}" rel="stylesheet">
    <style>
        body { min-height: 100vh; display: grid; place-items: center; padding: 24px 12px; }
        .reset-card { width: min(100%, 520px); }
        .reset-card input { display: block; width: 100%; }
    </style>
</head>
<body class="bg-gradient-primary">
    <main class="card reset-card border-0 shadow-lg">
        <div class="card-body p-4 p-md-5">
            <header class="text-center mb-4">
                <h1 class="h4 text-gray-900">{% block heading %}Password reset{% endblock %}</h1>
                <p class="mb-0 text-muted">Textile POS account access</p>
            </header>
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
